[project]
name = "tech-handoff"
version = "0.6.3"
description = "Turn product requirements into repository-grounded technical handoffs."
requires-python = ">=3.11"
dependencies = [
    "grep-ast==0.9.0",
    "lark-channel-sdk==1.2.0",
    "litellm==1.93.0",
    "serena-agent==1.7.0",
]

[project.scripts]
tech-handoff = "tracker.cli:main"
project-tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
