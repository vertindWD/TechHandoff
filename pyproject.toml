[project]
name = "project-tracker-agent"
version = "0.6.0"
description = "Turn meeting notes into evidence-backed technical plans for a registered codebase."
requires-python = ">=3.11"
dependencies = [
    "grep-ast==0.9.0",
    "lark-channel-sdk==1.2.0",
    "serena-agent==1.7.0",
]

[project.scripts]
project-tracker = "tracker.cli:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
